<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D98A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1F26" />
      <stop offset="100%" stop-color="#0A0D10" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Outer Gold Dashed Accent Ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />

  <!-- Central Luxury Ember & Flame Icon -->
  <g filter="url(#goldGlow)">
    <!-- Royal Diamond Star -->
    <path d="M64 24 L70 42 L88 48 L70 54 L64 72 L58 54 L40 48 L58 42 Z" fill="url(#goldGrad)" />
    
    <!-- Culinary Flame & Leaves -->
    <path d="M64 56 C74 70 82 80 82 92 C82 102 74 108 64 108 C54 108 46 102 46 92 C46 80 54 70 64 56 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Inner Flame Core -->
    <path d="M64 72 C68 80 72 86 72 93 C72 98 68 101 64 101 C60 101 56 98 56 93 C56 86 60 80 64 72 Z" fill="url(#goldGrad)" />
    
    <!-- Four Corner Stars -->
    <circle cx="64" cy="16" r="2" fill="url(#goldGrad)" />
    <circle cx="112" cy="64" r="2" fill="url(#goldGrad)" />
    <circle cx="64" cy="112" r="2" fill="url(#goldGrad)" />
    <circle cx="16" cy="64" r="2" fill="url(#goldGrad)" />
  </g>
</svg>